<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공부 기록 관리자 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen p-4 sm:p-6 lg:p-8">

  <div class="max-w-6xl mx-auto">
    
    <!-- 1. 비밀번호 인증 화면 -->
    <div id="authScreen" class="max-w-md mx-auto mt-16 bg-white rounded-2xl shadow-xl p-8 border border-slate-100 text-center">
      <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-800 mb-1">관리자 인증</h1>
      <p class="text-sm text-slate-500 mb-6">관리자 전용 페이지를 보려면 비밀번호를 입력하세요.</p>
      
      <form id="authForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <input type="password" id="adminPassword" required placeholder="비밀번호 입력 (0114)"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
        </div>
        <div id="authError" class="text-rose-500 text-xs font-medium hidden">비밀번호가 올바르지 않습니다.</div>
        <button type="submit"
          class="w-full py-3 px-6 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold rounded-xl shadow-md transition cursor-pointer">
          로그인
        </button>
      </form>
    </div>

    <!-- 2. 관리자 대시보드 화면 (로그인 후 표시) -->
    <div id="dashboardScreen" class="hidden space-y-6">
      
      <!-- 헤더 -->
      <div class="bg-gradient-to-r from-slate-900 to-indigo-900 rounded-2xl p-6 sm:p-8 text-white shadow-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <span class="inline-block px-3 py-1 bg-white/10 backdrop-blur-sm rounded-full text-xs font-medium tracking-wider mb-2">
            ADMINISTRATOR PANEL
          </span>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">전체 공부 기록 관리</h1>
          <p class="text-slate-300 text-sm mt-1">학생들이 제출한 모든 학습 기록을 조회하고 관리할 수 있습니다.</p>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="fetchAllLogs()" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-sm font-medium transition flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-rotate-right"></i> 새로고침
          </button>
          <button onclick="handleLogout()" class="px-4 py-2 bg-rose-600/80 hover:bg-rose-600 rounded-xl text-sm font-medium transition flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
          </button>
        </div>
      </div>

      <!-- 통계 및 필터 바 -->
      <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2 text-sm text-slate-600 font-medium">
          <i class="fa-solid fa-database text-indigo-500"></i>
          총 제출 기록: <span id="totalCount" class="font-bold text-indigo-600">0</span>건
        </div>
        <div class="w-full sm:w-72">
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" id="searchInput" oninput="filterLogs()" placeholder="날짜, 공부 내용으로 검색..."
              class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
        </div>
      </div>

      <!-- 기록 테이블 카드 -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                <th class="py-3.5 px-4">날짜</th>
                <th class="py-3.5 px-4">공부 시간대</th>
                <th class="py-3.5 px-4">총 공부량</th>
                <th class="py-3.5 px-4">공부한 내용</th>
                <th class="py-3.5 px-4">내일 계획</th>
                <th class="py-3.5 px-4">제출 일시</th>
              </tr>
            </thead>
            <tbody id="logsTableBody" class="divide-y divide-slate-100 text-sm">
              <tr>
                <td colspan="6" class="text-center py-8 text-slate-400">
                  <i class="fa-solid fa-spinner fa-spin mr-2"></i> 데이터를 불러오는 중...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script>
    const CORRECT_PASSWORD = "0114";
    let allLogsData = [];

    function handleLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById('adminPassword').value;
      const errBox = document.getElementById('authError');

      if (pwd === CORRECT_PASSWORD) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        fetchAllLogs();
      } else {
        errBox.classList.remove('hidden');
        document.getElementById('adminPassword').value = '';
        document.getElementById('adminPassword').focus();
      }
    }

    function handleLogout() {
      document.getElementById('dashboardScreen').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('adminPassword').value = '';
      document.getElementById('authError').classList.add('hidden');
    }

    function fetchAllLogs() {
      const tbody = document.getElementById('logsTableBody');
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> 데이터를 불러오는 중...</td></tr>`;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(logs) {
            allLogsData = logs || [];
            renderTable(allLogsData);
            document.getElementById('totalCount').textContent = allLogsData.length;
          })
          .withFailureHandler(function(error) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-rose-500">데이터를 불러오지 못했습니다: ${error.message}</td></tr>`;
          })
          .getAllStudyLogs();
      } else {
        // 테스트 환경 목데이터
        setTimeout(() => {
          allLogsData = [
            {
              date: "2026-06-07",
              timeRanges: "1타임: 09:00 ~ 11:30\n2타임: 14:00 ~ 16:00",
              duration: "4시간 30분",
              studied: "1. 수학 미적분 2단원 문제풀이\n2. 영어 단어 암기",
              tomorrow: "물리학 기출문제 풀이",
              timestamp: "2026-06-07 18:00:00"
            }
          ];
          renderTable(allLogsData);
          document.getElementById('totalCount').textContent = allLogsData.length;
        }, 500);
      }
    }

    function renderTable(logs) {
      const tbody = document.getElementById('logsTableBody');
      
      if (!logs || logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">저장된 기록이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = logs.map(log => `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="py-4 px-4 font-bold text-slate-700 whitespace-nowrap">${escapeHtml(log.date)}</td>
          <td class="py-4 px-4 text-xs text-slate-600 whitespace-pre-line">${escapeHtml(log.timeRanges)}</td>
          <td class="py-4 px-4 whitespace-nowrap">
            <span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 font-semibold text-xs rounded-lg">
              ${escapeHtml(log.duration)}
            </span>
          </td>
          <td class="py-4 px-4 text-slate-600 whitespace-pre-line text-xs max-w-xs">${escapeHtml(log.studied)}</td>
          <td class="py-4 px-4 text-slate-500 text-xs max-w-xs">${escapeHtml(log.tomorrow || '-')}</td>
          <td class="py-4 px-4 text-slate-400 text-xs whitespace-nowrap">${escapeHtml(log.timestamp)}</td>
        </tr>
      `).join('');
    }

    function filterLogs() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allLogsData.filter(log => 
        log.date.toLowerCase().includes(keyword) ||
        log.studied.toLowerCase().includes(keyword) ||
        log.timeRanges.toLowerCase().includes(keyword) ||
        (log.tomorrow && log.tomorrow.toLowerCase().includes(keyword))
      );
      renderTable(filtered);
      document.getElementById('totalCount').textContent = filtered.length;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(️/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
